<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Hi, I'm Rudyy. Engineering Student and AI/ML Enthusiast.">
  <style>
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .3s; }
    .d3 { animation-delay: .95s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s .7s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="898" height="278" rx="14" fill="#0e1013" stroke="#262b33"/>
  <rect x="1" y="1" width="898" height="278" rx="14" fill="url(#grid)"/>
  <ellipse cx="745" cy="150" rx="190" ry="130" fill="url(#glow)"/>

  <!-- file label -->
  <circle cx="60" cy="48" r="4" fill="#ff5a36"/>
  <text class="mono" x="74" y="52" font-size="13" fill="#6b7280">~/rudyy/README.md</text>

  <!-- greeting + name -->
  <text class="serif rise d1" x="56" y="116" font-size="30" fill="#8b94a1">Hi, I'm</text>
  <text class="serif rise d2" x="52" y="196" font-size="96" font-weight="700" fill="#f4f1ea">Rudyy</text>
  <path class="line" pathLength="1" d="M58 214 H345" stroke="#ff5a36" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- tagline -->
  <text class="mono rise d3" x="56" y="252" font-size="17" fill="#9aa3af">Engineering Student <tspan fill="#ff5a36">/</tspan> AI/ML Enthusiast<tspan class="blink" fill="#ff5a36">_</tspan></text>

  <!-- cube -->
  <g class="float">
    <polygon points="745,60 822.94,105 822.94,195 745,240 667.06,195 667.06,105" fill="#14171b"/>

    <g transform="matrix(25.98 15 25.98 -15 667.06 105)">
      <rect x=".04" y=".04" width=".92" height=".92" rx=".1" fill="#f5c518"/>
      <rect x="1.04" y=".04" width=".92" height=".92" rx=".1" fill="#f4f1ea"/>
      <rect x="2.04" y=".04" width=".92" height=".92" rx=".1" fill="#ff5a36"/>
      <rect x=".04" y="1.04" width=".92" height=".92" rx=".1" fill="#f4f1ea"/>
      <rect x="1.04" y="1.04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
      <rect x="2.04" y="1.04" width=".92" height=".92" rx=".1" fill="#f4f1ea"/>
      <rect x=".04" y="2.04" width=".92" height=".92" rx=".1" fill="#ff9a1f"/>
      <rect x="1.04" y="2.04" width=".92" height=".92" rx=".1" fill="#f4f1ea"/>
      <rect x="2.04" y="2.04" width=".92" height=".92" rx=".1" fill="#2fbf71"/>
    </g>

    <g transform="matrix(25.98 15 0 30 667.06 105)" opacity=".72">
      <rect x=".04" y=".04" width=".92" height=".92" rx=".1" fill="#ff5a36"/>
      <rect x="1.04" y=".04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
      <rect x="2.04" y=".04" width=".92" height=".92" rx=".1" fill="#ff5a36"/>
      <rect x=".04" y="1.04" width=".92" height=".92" rx=".1" fill="#2fbf71"/>
      <rect x="1.04" y="1.04" width=".92" height=".92" rx=".1" fill="#ff5a36"/>
      <rect x="2.04" y="1.04" width=".92" height=".92" rx=".1" fill="#f4f1ea"/>
      <rect x=".04" y="2.04" width=".92" height=".92" rx=".1" fill="#ff5a36"/>
      <rect x="1.04" y="2.04" width=".92" height=".92" rx=".1" fill="#f5c518"/>
      <rect x="2.04" y="2.04" width=".92" height=".92" rx=".1" fill="#ff5a36"/>
    </g>

    <g transform="matrix(25.98 -15 0 30 745 150)" opacity=".88">
      <rect x=".04" y=".04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
      <rect x="1.04" y=".04" width=".92" height=".92" rx=".1" fill="#2fbf71"/>
      <rect x="2.04" y=".04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
      <rect x=".04" y="1.04" width=".92" height=".92" rx=".1" fill="#ff9a1f"/>
      <rect x="1.04" y="1.04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
      <rect x="2.04" y="1.04" width=".92" height=".92" rx=".1" fill="#f5c518"/>
      <rect x=".04" y="2.04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
      <rect x="1.04" y="2.04" width=".92" height=".92" rx=".1" fill="#f4f1ea"/>
      <rect x="2.04" y="2.04" width=".92" height=".92" rx=".1" fill="#2b7de9"/>
    </g>
  </g>
</svg>
